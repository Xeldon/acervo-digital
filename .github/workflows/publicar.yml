# Publica a pasta app/ no GitHub Pages (HTTPS) a cada envio para a branch main.
# Também dá para rodar à mão em Actions > "Publicar no GitHub Pages" > Run workflow.
# Antes da primeira vez: no repositório, Settings > Pages > Source: "GitHub Actions".

name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
